name: Build and test

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch: {}

permissions:
  checks: write
  contents: read
  issues: read
  packages: write
  pull-requests: write

jobs:
  build-jammy:
    runs-on: ubuntu-22.04
    steps: &build_steps
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            libboost-all-dev \
            libeigen3-dev \
            libgeotiff-dev \
            libgtest-dev \
            liblaszip-dev \
            libproj-dev \
            libqhull-dev \
            libtbb-dev \
            libtiff-dev

      - name: Build and install libnabo
        run: |
          git clone https://github.com/ethz-asl/libnabo.git
          cd libnabo
          git checkout tags/1.1.2
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Checkout raycloudtools
        uses: actions/checkout@master
        with:
          repository: ${{ github.repository_owner }}/raycloudtools
          path: raycloudtools
          ssh-key: ${{ secrets.RAYCLOUDTOOLS_SSH_KEY }}

      - name: Build raycloudtools
        run: |
          BUILD_ROOT="$(pwd)/build/raycloudtools"
          INSTALL_ROOT="$(pwd)/install"
          mkdir --parents "${BUILD_ROOT}" "${INSTALL_ROOT}"
          cmake \
            -S raycloudtools \
            -B "${BUILD_ROOT}" \
            -DCMAKE_INSTALL_PREFIX:STRING="${INSTALL_ROOT}" \
            -DRAYLIB_WITH_QHULL:BOOL=ON \
            -DRAYCLOUD_BUILD_TESTS:BOOL=ON
          make \
            -C "${BUILD_ROOT}" \
            -j "$(nproc)" \
            install

      - name: Checkout treetools
        uses: actions/checkout@v4
        with:
          path: treetools

      - name: Build and test treetools
        run: |
          BUILD_ROOT="$(pwd)/build/treetools"
          INSTALL_ROOT="$(pwd)/install"
          mkdir --parents "${BUILD_ROOT}" "${INSTALL_ROOT}"
          cmake \
            -S treetools \
            -B "${BUILD_ROOT}" \
            -DCMAKE_INSTALL_PREFIX:STRING="${INSTALL_ROOT}" \
            -DTREE_BUILD_TESTS:BOOL=ON
          make \
            -C "${BUILD_ROOT}" \
            -j "$(nproc)" \
            install
          export "LD_LIBRARY_PATH=${INSTALL_ROOT}/lib:${LD_LIBRARY_PATH}"
          export "PATH=${INSTALL_ROOT}/bin:${PATH}"
          cd "${INSTALL_ROOT}/bin"
          "${BUILD_ROOT}/tests/treetest/treetest" --gtest_output=xml:report.xml
          pwd
          find "$(pwd)" -name report.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: install/bin/report.xml

